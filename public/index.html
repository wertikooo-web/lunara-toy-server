<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лунара — AI Мишка</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0a0618;
    --bg2: #12082a;
    --purple: #7c3aed;
    --purple2: #a855f7;
    --purple3: #c084fc;
    --gold: #fbbf24;
    --gold2: #fde68a;
    --text: #f5f0ff;
    --text2: #c4b5fd;
    --bubble-bg: rgba(30,15,60,0.95);
    --bubble-border: rgba(168,85,247,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 60% 20%, #1a0a3e 0%, #0a0618 60%);
    font-family: 'Comfortaa', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* ── Stars ── */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; border-radius: 50%; background: white;
    animation: twinkle var(--d,3s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
  }
  @keyframes twinkle {
    0%,100% { opacity:0.15; transform:scale(1); }
    50%      { opacity:1;    transform:scale(1.4); }
  }

  /* ── Moon glow behind bear ── */
  .moon-glow {
    position: absolute;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(251,191,36,0.12) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -60%);
    pointer-events: none;
    z-index: 1;
  }

  /* ── Main container ── */
  .container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
    width: 100%; max-width: 420px;
    padding: 20px 20px 28px;
  }

  /* ── Title ── */
  .title-wrap { text-align: center; }
  .title {
    font-family: 'Unbounded', sans-serif;
    font-weight: 900;
    font-size: 2.6rem;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #fde68a 0%, #f0abfc 50%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(192,132,252,0.6));
    line-height: 1;
  }
  .title-sub {
    font-size: 0.72rem;
    letter-spacing: 4px;
    color: var(--text2);
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.7;
  }

  /* ── Bear image ── */
  .bear-wrap {
    position: relative;
    width: 200px; height: 200px;
  }
  .bear-img {
    width: 100%; height: 100%;
    object-fit: contain;
    border-radius: 50%;
    filter: drop-shadow(0 0 30px rgba(168,85,247,0.5))
            drop-shadow(0 0 60px rgba(251,191,36,0.2));
    transition: filter 0.4s ease, transform 0.3s ease;
  }
  .bear-wrap.speaking .bear-img {
    animation: bearSpeak 0.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 40px rgba(168,85,247,0.8))
            drop-shadow(0 0 80px rgba(192,132,252,0.4));
  }
  .bear-wrap.thinking .bear-img {
    animation: bearThink 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(251,191,36,0.7));
  }
  @keyframes bearSpeak {
    from { transform: scale(1) rotate(-1deg); }
    to   { transform: scale(1.04) rotate(1deg); }
  }
  @keyframes bearThink {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50%     { transform: scale(1.02) rotate(2deg); }
  }

  /* Glow ring around bear */
  .bear-ring {
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 2px solid transparent;
    background: linear-gradient(var(--bg1), var(--bg1)) padding-box,
                linear-gradient(135deg, rgba(168,85,247,0.6), rgba(251,191,36,0.3), rgba(192,132,252,0.6)) border-box;
    animation: ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100% { opacity:0.4; transform:scale(1); }
    50%     { opacity:1;   transform:scale(1.03); }
  }

  /* ── Speech bubble ── */
  .bubble {
    width: 100%;
    background: var(--bubble-bg);
    border: 1px solid var(--bubble-border);
    border-radius: 20px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(124,58,237,0.2), inset 0 1px 0 rgba(255,255,255,0.05);
    min-height: 70px;
    position: relative;
  }
  .bubble::before {
    content: '';
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-bottom-color: var(--bubble-border);
  }
  .bubble-inner {
    display: flex; align-items: flex-start; gap: 10px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade80;
    flex-shrink: 0; margin-top: 6px;
  }
  .status-dot.thinking { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: dp 0.8s ease-in-out infinite; }
  .status-dot.speaking { background: var(--purple3); box-shadow: 0 0 8px var(--purple3); animation: dp 0.4s ease-in-out infinite; }
  @keyframes dp { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  .bubble-text {
    font-size: 0.95rem; font-weight: 600; line-height: 1.5; color: var(--text);
    flex: 1;
  }

  /* Waveform */
  .waveform { display:none; align-items:center; gap:3px; height:20px; margin-top:8px; }
  .waveform.active { display:flex; }
  .wave-bar {
    width:3px; border-radius:2px; background:var(--purple3);
    animation: wv var(--d,.6s) ease-in-out infinite alternate;
    animation-delay: var(--delay,0s);
  }
  @keyframes wv { from{height:3px} to{height:18px} }

  /* ── Audio player ── */
  .audio-wrap { width:100%; display:none; }
  .audio-wrap.visible { display:block; }
  audio { width:100%; border-radius:12px; accent-color:var(--purple2); }

  /* ── Server row ── */
  .server-row {
    width:100%; display:flex; align-items:center; gap:8px;
  }
  .conn-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:#4ade80; box-shadow:0 0 6px #4ade80; }
  .conn-dot.offline { background:#f87171; box-shadow:0 0 6px #f87171; }
  .server-input {
    flex:1; background:rgba(255,255,255,0.04); border:1px solid rgba(168,85,247,0.25);
    border-radius:10px; padding:8px 12px; color:var(--text2);
    font-family:'Courier New',monospace; font-size:0.75rem; outline:none;
    transition:border-color 0.2s;
  }
  .server-input:focus { border-color:var(--purple2); color:var(--text); }

  /* ── Input row ── */
  .input-row { width:100%; display:flex; gap:8px; }
  .msg-input {
    flex:1; background:rgba(255,255,255,0.06); border:1.5px solid rgba(168,85,247,0.3);
    border-radius:16px; padding:14px 18px; color:var(--text);
    font-family:'Comfortaa',sans-serif; font-size:0.95rem; font-weight:600; outline:none;
    transition:border-color 0.2s, background 0.2s;
  }
  .msg-input:focus { border-color:var(--purple2); background:rgba(255,255,255,0.09); }
  .msg-input::placeholder { color:rgba(196,181,253,0.4); }

  .btn-dice {
    background:rgba(255,255,255,0.05); border:1.5px solid rgba(168,85,247,0.3);
    border-radius:14px; padding:0 14px; height:52px; cursor:pointer;
    color:var(--text2); font-family:'Comfortaa',sans-serif; font-size:0.75rem; font-weight:700;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    transition:all 0.15s;
  }
  .btn-dice:hover { border-color:var(--purple2); color:var(--purple3); background:rgba(168,85,247,0.1); }

  .btn-send {
    background:linear-gradient(135deg, var(--purple) 0%, var(--purple2) 100%);
    border:none; border-radius:16px; width:52px; height:52px; cursor:pointer;
    font-size:1.3rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 20px rgba(124,58,237,0.5); transition:all 0.15s;
  }
  .btn-send:hover  { transform:scale(1.08); box-shadow:0 6px 24px rgba(168,85,247,0.7); }
  .btn-send:active { transform:scale(0.94); }
  .btn-send:disabled { opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none; }

  /* ── Mic row ── */
  .mic-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .mic-hint {
    font-size: 0.72rem;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.55;
    user-select: none;
  }

  .btn-mic {
    background: linear-gradient(135deg, #1e0a3e 0%, #2d0f5a 100%);
    border: 2.5px solid rgba(192,132,252,0.5);
    border-radius: 50%;
    width: 80px; height: 80px;
    cursor: pointer;
    font-size: 1.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 0 24px rgba(168,85,247,0.35), inset 0 1px 0 rgba(255,255,255,0.07);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .btn-mic:hover {
    border-color: var(--purple2);
    box-shadow: 0 0 36px rgba(168,85,247,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
    transform: scale(1.05);
  }
  .btn-mic.recording {
    background: linear-gradient(135deg, #3b0a0a 0%, #5c1010 100%);
    border-color: #f87171;
    box-shadow: 0 0 40px rgba(248,113,113,0.7), 0 0 80px rgba(248,113,113,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
    animation: micPulse 0.55s ease-in-out infinite alternate;
    transform: scale(1.08);
  }
  @keyframes micPulse {
    from { box-shadow: 0 0 24px rgba(248,113,113,0.5), 0 0 60px rgba(248,113,113,0.15); }
    to   { box-shadow: 0 0 50px rgba(248,113,113,0.9), 0 0 100px rgba(248,113,113,0.35); }
  }
  .btn-mic:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="moon-glow"></div>

<div class="container">

  <!-- Title -->
  <div class="title-wrap">
    <div class="title">LUNARA</div>
    <div class="title-sub">✦ AI — Мишка ✦ Демо</div>
  </div>

  <!-- Bear -->
  <div class="bear-wrap" id="bearWrap">
    <div class="bear-ring"></div>
    <img class="bear-img" id="bearImg"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='55' cy='55' r='28' fill='%23b45309'/%3E%3Ccircle cx='145' cy='55' r='28' fill='%23b45309'/%3E%3Ccircle cx='55' cy='55' r='17' fill='%23d97706'/%3E%3Ccircle cx='145' cy='55' r='17' fill='%23d97706'/%3E%3Cellipse cx='100' cy='148' rx='55' ry='48' fill='%23b45309'/%3E%3Ccircle cx='100' cy='95' r='58' fill='%23d97706'/%3E%3Cellipse cx='100' cy='108' rx='32' ry='24' fill='%23fef3c7'/%3E%3Ccircle cx='82' cy='85' r='9' fill='white'/%3E%3Ccircle cx='118' cy='85' r='9' fill='white'/%3E%3Ccircle cx='84' cy='86' r='5' fill='%231a0a2e'/%3E%3Ccircle cx='120' cy='86' r='5' fill='%231a0a2e'/%3E%3Ccircle cx='86' cy='84' r='2' fill='white'/%3E%3Ccircle cx='122' cy='84' r='2' fill='white'/%3E%3Cellipse cx='100' cy='103' rx='9' ry='6' fill='%2392400e'/%3E%3Cpath d='M 88 114 Q 100 124 112 114' stroke='%2392400e' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Cellipse cx='100' cy='148' rx='28' ry='22' fill='%23fef3c7' opacity='.7'/%3E%3Cellipse cx='58' cy='168' rx='18' ry='12' fill='%23b45309'/%3E%3Cellipse cx='142' cy='168' rx='18' ry='12' fill='%23b45309'/%3E%3C/svg%3E"
      alt="Лунара" />
  </div>

  <!-- Bubble -->
  <div class="bubble" id="bubble">
    <div class="bubble-inner">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <div class="bubble-text" id="bubbleText">Привет! Я Лунара ✨ Напиши мне что-нибудь!</div>
        <div class="waveform" id="waveform">
          <div class="wave-bar" style="--d:.5s;--delay:0s"></div>
          <div class="wave-bar" style="--d:.7s;--delay:.1s"></div>
          <div class="wave-bar" style="--d:.4s;--delay:.2s"></div>
          <div class="wave-bar" style="--d:.8s;--delay:.05s"></div>
          <div class="wave-bar" style="--d:.6s;--delay:.15s"></div>
          <div class="wave-bar" style="--d:.5s;--delay:.25s"></div>
          <div class="wave-bar" style="--d:.7s;--delay:.1s"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio -->
  <div class="audio-wrap" id="audioWrap">
    <audio id="audioPlayer" controls></audio>
  </div>

  <!-- Server -->
  <div class="server-row">
    <div class="conn-dot" id="connDot"></div>
    <input class="server-input" id="serverUrl"
      value="https://lunara-toy-server-production.up.railway.app" />
  </div>

  <!-- Input -->
  <div class="input-row">
    <input class="msg-input" id="msgInput"
      placeholder="Напиши Лунаре..." maxlength="200" />
    <button class="btn-dice" onclick="randomPhrase()">🎲 фраза</button>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">✦</button>
  </div>

  <!-- Mic row -->
  <div class="mic-row">
    <button class="btn-mic" id="micBtn">🎙️</button>
    <span class="mic-hint" id="micHint">удержи и говори</span>
  </div>

</div>

<script>
// ── Stars ────────────────────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.5 + 0.5;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*5}s;--delay:${Math.random()*5}s`;
  starsEl.appendChild(s);
}

// ── Refs ─────────────────────────────────────────────────────────────────────
const bearWrap   = document.getElementById('bearWrap');
const bubbleText = document.getElementById('bubbleText');
const statusDot  = document.getElementById('statusDot');
const waveform   = document.getElementById('waveform');
const audioWrap  = document.getElementById('audioWrap');
const audioPlayer= document.getElementById('audioPlayer');
const sendBtn    = document.getElementById('sendBtn');
const msgInput   = document.getElementById('msgInput');
const connDot    = document.getElementById('connDot');
const serverUrl  = document.getElementById('serverUrl');

let isProcessing = false;

// ── Bear states ───────────────────────────────────────────────────────────────
function setBear(state) {
  bearWrap.className = 'bear-wrap ' + (state || '');
  statusDot.className = 'status-dot ' + (state || '');
  waveform.className  = 'waveform' + (state === 'speaking' ? ' active' : '');
}

// ── Health check ──────────────────────────────────────────────────────────────
async function checkServer() {
  const base = serverUrl.value.trim().replace(/\/$/, '');
  try {
    const r = await fetch(`${base}/health`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) { connDot.className='conn-dot'; return true; }
  } catch {}
  connDot.className = 'conn-dot offline';
  return false;
}
checkServer();
setInterval(checkServer, 15000);

// ── Send ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isProcessing) return;
  const base = serverUrl.value.trim().replace(/\/$/, '');

  isProcessing = true;
  sendBtn.disabled = true;
  msgInput.disabled = true;
  setBear('thinking');
  bubbleText.textContent = '...';
  audioWrap.className = 'audio-wrap';

  try {
    const res = await fetch(`${base}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: AbortSignal.timeout(30000),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    bubbleText.textContent = data.reply || '...';
    if (data.audio_url) {
      setBear('speaking');
      audioPlayer.src = data.audio_url;
      audioWrap.className = 'audio-wrap visible';
      audioPlayer.play().catch(() => {});
      audioPlayer.onended = () => setBear('');
    } else {
      setBear('');
    }
    msgInput.value = '';
  } catch (err) {
    setBear('');
    bubbleText.textContent = '😿 ' + err.message;
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    msgInput.disabled = false;
    msgInput.focus();
  }
}

// ── Random phrases ────────────────────────────────────────────────────────────
const PHRASES = [
  'Привет, как тебя зовут?',
  'Мне скучно, давай поиграем!',
  'Загадай мне загадку!',
  'Расскажи сказку про мишку',
  'Я хочу гулять но на улице дождик',
  'Почему небо синее?',
  'Я боюсь темноты',
  'Мне грустно сегодня',
  'Сколько лапок у паука?',
  'Давай считать вместе!',
  'Расскажи что-нибудь весёлое',
  'Я нашёл жука на улице!',
  'Мама ушла на работу',
  'Покажи как рычит медведь',
  'Я не хочу есть кашу!',
  'Кто живёт в лесу?',
  'Давай придумаем историю про дракона',
  'Я умею прыгать на одной ножке!',
  'Спой мне песенку',
  'Почему кошки мурчат?',
];
function randomPhrase() {
  msgInput.value = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  msgInput.focus();
}

msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ── Voice input — Push-to-Talk ───────────────────────────────────────────────
const micBtn  = document.getElementById('micBtn');
const micHint = document.getElementById('micHint');
let recognition = null;
let isRecording = false;
let holdActive   = false;   // true while finger/mouse is down

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous    = true;   // keep recording while held
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '🔴';
    micHint.textContent = 'говори...';
    msgInput.placeholder = 'Говори...';
    msgInput.value = '';
  };

  recognition.onresult = (e) => {
    let interim = '';
    let final   = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final  += e.results[i][0].transcript;
      else                       interim += e.results[i][0].transcript;
    }
    msgInput.value = final || interim;
  };

  recognition.onend = () => {
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙️';
    micHint.textContent = 'удержи и говори';
    msgInput.placeholder = 'Напиши Лунаре...';
    // auto-send only if button was released (not an error restart)
    if (!holdActive && msgInput.value.trim()) {
      setTimeout(() => sendMessage(), 200);
    }
  };

  recognition.onerror = (e) => {
    holdActive  = false;
    isRecording = false;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎙️';
    micHint.textContent = 'удержи и говори';
    msgInput.placeholder = 'Напиши Лунаре...';
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      bubbleText.textContent = '🎤 ' + e.error;
    }
  };

  // ── Push-to-Talk handlers ─────────────────────────────────────────────────
  function startMic(e) {
    if (isProcessing) return;
    holdActive = true;
    if (!isRecording) {
      try { recognition.start(); } catch(_) {}
    }
  }

  function stopMic(e) {
    holdActive = false;
    if (isRecording) {
      try { recognition.stop(); } catch(_) {}
    }
  }

  micBtn.addEventListener('mousedown',  startMic);
  micBtn.addEventListener('mouseup',    stopMic);
  micBtn.addEventListener('mouseleave', stopMic);    // left button area while holding
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); }, { passive: false });
  micBtn.addEventListener('touchend',   (e) => { e.preventDefault(); stopMic();  }, { passive: false });
  micBtn.addEventListener('touchcancel',(e) => { e.preventDefault(); stopMic();  }, { passive: false });

} else {
  micBtn.disabled = true;
  micBtn.title    = 'Голосовой ввод не поддерживается (используй Chrome)';
  micBtn.style.opacity = '0.3';
  micHint.textContent  = 'только Chrome';
}

</script>
</body>
</html>
