<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumi">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Луми — AI Мишка</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/lumi-icon.svg">
<link rel="apple-touch-icon" href="/icons/lumi-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #7c3aed;
  --purple2: #a855f7;
  --purple3: #c084fc;
  --gold: #fbbf24;
  --text: #f5f0ff;
  --text2: #c4b5fd;
  --bg: #0a0618;
  --bubble-bg: rgba(30,15,60,0.97);
  --bubble-border: rgba(168,85,247,0.45);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #05030f;
  font-family: 'Comfortaa', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Stars — desktop background */
.bg-stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star {
  position:absolute; border-radius:50%; background:white;
  animation: twinkle var(--d,3s) ease-in-out infinite;
  animation-delay: var(--delay,0s);
}
@keyframes twinkle {
  0%,100% { opacity:0.08; } 50% { opacity:0.6; }
}

/* ── Phone shell ── */
.phone {
  position: relative;
  z-index: 10;
  width: 390px;
  height: min(780px, calc(100vh - 24px));
  background: radial-gradient(ellipse at 55% 10%, #1a0a3e 0%, #0a0618 65%);
  border-radius: 44px;
  border: 2px solid rgba(168,85,247,0.25);
  box-shadow: 0 0 0 6px #0d0920, 0 0 0 8px rgba(168,85,247,0.12), 0 40px 80px rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* notch */
.phone::before {
  content:'';
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:90px; height:5px; background:rgba(168,85,247,0.25); border-radius:3px; z-index:20;
}

/* phone stars */
.phone-stars { position:absolute; inset:0; border-radius:44px; overflow:hidden; pointer-events:none; z-index:0; }

/* Mobile — full screen */
@media (max-width:480px) {
  body { background: radial-gradient(ellipse at 55% 10%, #1a0a3e 0%, #0a0618 65%); }
  .bg-stars { display:none; }
  .phone { width:100vw; height:100vh; border-radius:0; border:none; box-shadow:none; }
  .phone::before { display:none; }
  .phone-stars { border-radius:0; }
}

/* ── Scroll content ── */
.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding: 56px 16px 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0px;
  position: relative;
  z-index: 1;
}
.content::-webkit-scrollbar { display:none; }

/* ── Bottom fixed ── */
.bottom {
  flex-shrink: 0;
  position: relative;
  z-index: 2;
  background: linear-gradient(to top, #0a0618 60%, transparent);
  padding: 0px 16px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* ── Brand ── */
.brand {
  font-family:'Comfortaa',sans-serif;
  font-size:0.62rem; font-weight:700;
  letter-spacing:5px; text-transform:uppercase;
  color:rgba(251,191,36,0.65);
}
.title {
  font-family:'Unbounded',sans-serif; font-weight:900;
  font-size:1.9rem; letter-spacing:5px;
  background:linear-gradient(135deg,#fde68a 0%,#f0abfc 50%,#818cf8 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 14px rgba(192,132,252,.5));
  line-height:1;
}
.title-sub { font-size:0.6rem; letter-spacing:3px; color:var(--text2); opacity:0.55; margin-top:3px; }

/* ── Bear ── */
.bear-wrap { position:relative; width:170px; height:170px; flex-shrink:0; margin-top:38px; margin-bottom:38px; }
.bear-img {
  width:100%; height:100%; object-fit:contain; border-radius:50%;
  filter:drop-shadow(0 0 22px rgba(168,85,247,.5)) drop-shadow(0 0 40px rgba(251,191,36,.12));
  transition:filter .4s;
}
.bear-wrap.speaking .bear-img { animation:bSpeak .5s ease-in-out infinite alternate; filter:drop-shadow(0 0 32px rgba(168,85,247,.9)); }
.bear-wrap.thinking .bear-img { animation:bThink 1.2s ease-in-out infinite; filter:drop-shadow(0 0 26px rgba(251,191,36,.8)); }
@keyframes bSpeak { from{transform:scale(1) rotate(-1deg)} to{transform:scale(1.04) rotate(1deg)} }
@keyframes bThink { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
.bear-ring {
  position:absolute; inset:-7px; border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(#0a0618,#0a0618) padding-box,
             linear-gradient(135deg,rgba(168,85,247,.6),rgba(251,191,36,.3),rgba(192,132,252,.6)) border-box;
  animation:rPulse 3s ease-in-out infinite;
}
@keyframes rPulse { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:1;transform:scale(1.03)} }

/* ── Bubble ── */
.bubble {
  width:100%;
  background:var(--bubble-bg); border:1px solid var(--bubble-border);
  border-radius:16px; padding:12px 14px;
  backdrop-filter:blur(10px); box-shadow:0 4px 16px rgba(124,58,237,.12);
}
.bubble-inner { display:flex; align-items:flex-start; gap:8px; }
.dot {
  width:7px; height:7px; border-radius:50%; flex-shrink:0; margin-top:4px;
  background:#4ade80; box-shadow:0 0 5px #4ade80;
}
.dot.thinking { background:var(--gold); box-shadow:0 0 5px var(--gold); animation:dp .8s ease-in-out infinite; }
.dot.speaking  { background:var(--purple3); box-shadow:0 0 5px var(--purple3); animation:dp .4s ease-in-out infinite; }
@keyframes dp { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }
.bubble-text { font-size:.88rem; font-weight:600; line-height:1.5; color:var(--text); flex:1; white-space:pre-line; }

.waveform { display:none; align-items:center; gap:3px; height:16px; margin-top:6px; }
.waveform.active { display:flex; }
.wave-bar {
  width:3px; border-radius:2px; background:var(--purple3);
  animation:wv var(--d,.6s) ease-in-out infinite alternate;
  animation-delay:var(--delay,0s);
}
@keyframes wv { from{height:3px} to{height:14px} }

/* ── Audio ── */
.audio-wrap { width:100%; display:none; }
.audio-wrap.on { display:block; }
audio { width:100%; border-radius:10px; accent-color:var(--purple2); }

/* ── Status row ── */
.status-row { display:flex; align-items:center; gap:7px; }
.conn-dot { width:8px; height:8px; border-radius:50%; background:#4ade80; box-shadow:0 0 6px #4ade80; flex-shrink:0; }
.conn-dot.off { background:#f87171; box-shadow:0 0 6px #f87171; }
.conn-label { font-size:.72rem; color:var(--text2); font-weight:600; }

/* ── Text input row ── */
.input-row { width:100%; display:flex; gap:8px; align-items:center; }
.msg-input {
  flex:1; background:rgba(255,255,255,0.07); border:1.5px solid rgba(168,85,247,.3);
  border-radius:14px; padding:13px 14px; color:var(--text);
  font-family:'Comfortaa',sans-serif; font-size:.88rem; font-weight:600; outline:none;
  transition:border-color .2s;
}
.msg-input:focus { border-color:var(--purple2); }
.msg-input::placeholder { color:rgba(196,181,253,.35); }

.btn-dice {
  background:rgba(255,255,255,0.05); border:1.5px solid rgba(168,85,247,.25);
  border-radius:12px; width:46px; height:46px; cursor:pointer; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:all .15s;
}
.btn-dice:hover { border-color:var(--purple2); background:rgba(168,85,247,.1); }

.btn-send {
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  border:none; border-radius:14px; width:46px; height:46px; cursor:pointer;
  font-size:1.1rem; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; box-shadow:0 4px 14px rgba(124,58,237,.5); transition:all .15s;
}
.btn-send:hover  { transform:scale(1.08); }
.btn-send:active { transform:scale(.94); }
.btn-send:disabled { opacity:.3; cursor:not-allowed; transform:none; box-shadow:none; }

/* ── Big mic button ── */
.btn-mic-wrap { display:flex; justify-content:center; }
.btn-mic {
  width:64px; height:64px; border-radius:50%; cursor:pointer; font-size:1.6rem;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(168,85,247,.2));
  border:2px solid rgba(168,85,247,.5);
  box-shadow:0 0 20px rgba(124,58,237,.3);
  transition:all .2s;
}
.btn-mic:hover { box-shadow:0 0 30px rgba(168,85,247,.5); transform:scale(1.05); }
.btn-mic:active { transform:scale(.95); }
.btn-mic:disabled { opacity:.3; cursor:not-allowed; transform:none; }
.btn-mic.recording {
  background:linear-gradient(135deg,rgba(239,68,68,.3),rgba(248,113,113,.2));
  border-color:#f87171;
  animation:micPulse .6s ease-in-out infinite alternate;
}
@keyframes micPulse {
  from { box-shadow:0 0 12px rgba(248,113,113,.4); }
  to   { box-shadow:0 0 32px rgba(248,113,113,.9), 0 0 60px rgba(248,113,113,.3); }
}

  /* ── Language selector ── */
  .lang-row {
    position: absolute;
    top: 18px;
    right: 16px;
    display: flex;
    gap: 5px;
    z-index: 20;
  }
  .lang-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(168,85,247,0.25);
    border-radius: 8px;
    padding: 4px 9px;
    color: var(--text2);
    font-family: 'Comfortaa', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .lang-btn:hover { border-color: var(--purple2); color: var(--purple3); }
  .lang-btn.active {
    background: rgba(168,85,247,0.25);
    border-color: var(--purple2);
    color: var(--text);
    box-shadow: 0 0 10px rgba(168,85,247,0.3);
  }
  .model-row {
    position: absolute;
    top: 18px;
    left: 16px;
    display: flex;
    gap: 5px;
    z-index: 20;
  }
  .model-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(251,191,36,0.22);
    border-radius: 8px;
    padding: 4px 8px;
    color: rgba(251,191,36,0.72);
    font-family: 'Comfortaa', sans-serif;
    font-size: 0.66rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-user-select: none; user-select: none;
  }
  .model-btn:hover { border-color: var(--gold); color: #fde68a; }
  .model-btn.active {
    background: rgba(251,191,36,0.16);
    border-color: rgba(251,191,36,0.65);
    color: #fde68a;
    box-shadow: 0 0 10px rgba(251,191,36,0.18);
  }
  .model-status {
    color: rgba(196,181,253,.75);
    font-size: .72rem;
    margin-left: 6px;
  }
</style>
</head>

<script>
// ── Stars ─────────────────────────────────────────────────────────────────────
function makeStars(el, count) {
  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*5}s;--delay:${Math.random()*5}s`;
    el.appendChild(s);
  }
}
makeStars(document.getElementById('bgStars'), 60);
makeStars(document.getElementById('phoneStars'), 70);

// ── Refs ──────────────────────────────────────────────────────────────────────
const bearWrap   = document.getElementById('bearWrap');
const bubbleText = document.getElementById('bubbleText');
const dot        = document.getElementById('dot');
const waveform   = document.getElementById('waveform');
const audioWrap  = document.getElementById('audioWrap');
const audioPlayer= document.getElementById('audioPlayer');
const sendBtn    = document.getElementById('sendBtn');
const msgInput   = document.getElementById('msgInput');
const connDot    = document.getElementById('connDot');
const connLabel  = document.getElementById('connLabel');
const serverUrl  = document.getElementById('serverUrl');
const content    = document.getElementById('content');
const micBtn     = document.getElementById('micBtn');
const modelStatus= document.getElementById('modelStatus');

let isProcessing = false;
let currentLang = 'ru-RU'; // global — used in sendMessage and mic
let currentModel = 'auto';

function setLang(lang, btn) {
  currentLang = lang;
  const ids = ['langAUTO', 'langRU', 'langRO', 'langEN'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  });
  btn.classList.add('active');
}

function setModel(model, btn) {
  currentModel = model;
  const ids = ['modelGPT', 'modelDS', 'modelAUTO'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  });
  btn.classList.add('active');
  modelStatus.textContent = model.toUpperCase();
}

function updateModelStatus(data) {
  if (!data || !modelStatus) return;
  if (data.provider === 'content_cache') {
    modelStatus.textContent = 'CACHE';
    return;
  }
  const provider = data.provider || '';
  const latency = Number.isFinite(data.latency_ms) ? `${data.latency_ms}ms` : '';
  if (data.fallback) {
    const from = data.router_choice || data.requested_model || 'model';
    modelStatus.textContent = `${from} ERROR -> GPT ${latency}`.trim().toUpperCase();
    return;
  }
  const route = data.requested_model === 'auto' && data.router_choice
    ? `AUTO -> ${data.router_choice}`
    : provider;
  modelStatus.textContent = `${route} ${latency}`.trim().toUpperCase();
}

// ── Bear ──────────────────────────────────────────────────────────────────────
function setBear(state) {
  bearWrap.className = 'bear-wrap' + (state ? ' '+state : '');
  dot.className = 'dot' + (state ? ' '+state : '');
  waveform.className = 'waveform' + (state === 'speaking' ? ' active' : '');
}

// ── Server health ─────────────────────────────────────────────────────────────
async function checkServer() {
  const base = serverUrl.value.trim().replace(/\/$/, '');
  try {
    const r = await fetch(`${base}/health`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      connDot.className = 'conn-dot';
      connLabel.textContent = 'Connection OK';
    } else throw new Error();
  } catch {
    connDot.className = 'conn-dot off';
    connLabel.textContent = 'No connection';
  }
}
checkServer();
setInterval(checkServer, 15000);

// ── Send message ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isProcessing) return;
  const base = serverUrl.value.trim().replace(/\/$/, '');

  isProcessing = true;
  sendBtn.disabled = true;
  msgInput.disabled = true;
  setBear('thinking');
  bubbleText.textContent = '...';
  audioWrap.className = 'audio-wrap';

  try {
    const res = await fetch(`${base}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-device-id': 'lumi_001' },
      body: JSON.stringify({ text, lang: currentLang, model: currentModel }),
      signal: AbortSignal.timeout(30000),
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error || `HTTP ${res.status}`);
    }
    const data = await res.json();
    bubbleText.textContent = data.reply || '...';
    updateModelStatus(data);

    if (data.audio_url) {
      setBear('speaking');
      audioPlayer.src = data.audio_url;
      audioWrap.className = 'audio-wrap on';
      content.scrollTop = content.scrollHeight;
      audioPlayer.play().catch(() => {});
      audioPlayer.onended = () => setBear('');
    } else {
      setBear('');
    }
    msgInput.value = '';
  } catch (err) {
    setBear('');
    bubbleText.textContent = '😿 ' + err.message;
  } finally {
    isProcessing = false;
    sendBtn.disabled = false;
    msgInput.disabled = false;
    // Don't focus on mobile — prevents keyboard popup
  }
}

msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

      noSpeech: 'Я не расслышала. Попробуй ещё раз.',
      micAllowed: '🎤 Разреши доступ к микрофону в браузере',
      micError: '🎤 Ошибка: ',
      threeSeconds: '⚠️ Ещё 3 секунды...',
    },
    'ro-RO': {
      listening: '🎤 Te ascult...',
      placeholder: 'Scrie-i lui Lumi...',
      holdToTalk: 'Tine butonul si vorbeste...',
      noSpeech: 'Nu am auzit bine. Incearca inca o data.',
      micAllowed: '🎤 Permite accesul la microfon in browser',
      micError: '🎤 Eroare: ',
      threeSeconds: '⚠️ Inca 3 secunde...',
    },
    'en-US': {
      listening: '🎤 Listening...',
      placeholder: 'Write to Lumi...',
      holdToTalk: 'Hold the button and speak...',
      noSpeech: 'I did not hear that. Try again.',
      micAllowed: '🎤 Allow microphone access in the browser',
      micError: '🎤 Error: ',
      threeSeconds: '⚠️ 3 seconds left...',
    },
  };
  return dict[langKey][key] || dict['ru-RU'][key] || '';
}

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function createRec() {
    const r = new SR();
    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.lang = (currentLang === 'auto') ? '' : currentLang;

    r.onstart = () => {
      isRecording = true; micStarted = true; finalTranscript = '';
      bubbleBeforeMic = bubbleText.textContent || '';
      // Auto-stop if no speech for 10 seconds
      if (silenceTimer) clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        if (micHeld) {
          micHeld = false; // prevent restart loop
          stopMic();
        }
      }, 10000);
      micBtn.classList.add('recording');
      micBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="26" height="26" style="pointer-events:none;user-select:none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
      msgInput.placeholder = micText('holdToTalk');
      msgInput.value = '';
      bubbleText.textContent = micText('listening');
    };

    r.onresult = (e) => {
      // Speech detected — reset silence timer
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      if (e.results.length > 0 && e.results[0].isFinal) {
        finalTranscript = e.results[0][0].transcript;
        msgInput.value = finalTranscript;
      }
    };

    r.onend = () => {
      // Button still held — browser stopped on silence — restart
      if (micHeld && !isProcessing) {
        micStarted = false;
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        try {
          recognition = createRec();
          recognition.start();
          return;
        } catch(e) {}
      }
      // Button released — finalize and send
      isRecording = false; micStarted = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '<svg id="micIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28" style="pointer-events:none;user-select:none"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      msgInput.placeholder = micText('placeholder');
      const text = (finalTranscript || msgInput.value).trim();
      msgInput.blur();
      if (text) { msgInput.value = text; setTimeout(() => sendMessage(), 200); }
      else bubbleText.textContent = micText('noSpeech') || bubbleBeforeMic;
    };

    r.onerror = (e) => {
      isRecording = false; micStarted = false;
      micBtn.classList.remove('recording');
      micBtn.innerHTML = '<svg id="micIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28" style="pointer-events:none;user-select:none"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 10a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      msgInput.placeholder = micText('placeholder');
      if (e.error === 'not-allowed') bubbleText.textContent = micText('micAllowed');
      else if (e.error === 'no-speech') bubbleText.textContent = micText('noSpeech') || bubbleBeforeMic;
      else if (e.error !== 'aborted') bubbleText.textContent = micText('micError') + e.error;
    };
    return r;
  }

  let micStarted = false; // guard against multiple start calls
  let micHeld = false;    // true while button is physically held

  let silenceTimer = null; // auto-stop if no speech for 10s
  let micTimer = null;
  let micWarnTimer = null;
  const MAX_REC_MS = 20000;  // 20 seconds before warning
  const STOP_REC_MS = 23000; // 23 seconds — auto stop

  // Generate beep via Web Audio API
  function playBeep(freq = 880, duration = 0.2, vol = 0.3) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function startMic() {
    // Перебивание: при нажатии кнопки мгновенно глушим текущий ответ Lumi,
    // чтобы он не «договаривал» поверх новой записи.
    try { audioPlayer.pause(); audioPlayer.currentTime = 0; } catch(e) {}
    audioWrap.className = 'audio-wrap';
    setBear('');
    if (isProcessing || isRecording || micStarted) return;
    micHeld = true;
    micStarted = true;
    recognition = createRec();
    try {
      recognition.start();
      // Warning beep at 20s
      micWarnTimer = setTimeout(() => {
        playBeep(880, 0.15, 0.4); // first beep
        setTimeout(() => playBeep(880, 0.15, 0.4), 300); // second beep
        bubbleText.textContent = micText('threeSeconds');
      }, MAX_REC_MS);
      // Auto-stop at 23s
      micTimer = setTimeout(() => {
        stopMic();
      }, STOP_REC_MS);
    } catch(e) { micStarted = false; }
  }

  function stopMic() {
    micHeld = false; // button released
    // Always clear timers
    if (micTimer)     { clearTimeout(micTimer);     micTimer = null; }
    if (micWarnTimer) { clearTimeout(micWarnTimer); micWarnTimer = null; }
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    if (!isRecording && !micStarted) return;
    try { recognition.stop(); } catch(e) {}
  }

  // Desktop: hold mouse
  micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startMic(); });
  micBtn.addEventListener('mouseup',   (e) => { e.preventDefault(); stopMic(); });
  micBtn.addEventListener('mouseleave',(e) => { stopMic(); });

  // Mobile: hold touch — passive:false to allow preventDefault
  micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startMic(); }, { passive: false });
  micBtn.addEventListener('touchend',   (e) => { e.preventDefault(); stopMic(); document.activeElement && document.activeElement.blur(); }, { passive: false });
  micBtn.addEventListener('touchcancel',(e) => { e.preventDefault(); stopMic(); }, { passive: false });

} else {
  micBtn.disabled = true;
  micBtn.title = 'Используй Chrome';
  micBtn.style.opacity = '0.3';
}
</script>
